[project]
name = "hypermm"
version = "0.1.0"
description = "Queue-aware fill-model risk measurement for market-making backtests on Hyperliquid L4 data"
requires-python = ">=3.11"
readme = "README.md"

# Core deps: needed starting from Stage 1 (ingest) and Stage 2 (reconstruct).
# Everything else (ML validation, RL probe, UI) is an optional extra so the
# environment for "just parse the data" stays fast to install.
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "numba>=0.60",
    "msgspec>=0.18",
    "lz4>=4.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Stage 5-6: fillcheck (survival validation) + toxicity model
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "lifelines>=0.29",      # Cox PH / Kaplan-Meier baseline for fillcheck
    "scikit-survival>=0.23",
]
# Stage 5.9 (optional): RL probe
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
# Stage 6.9: replay UI / plots
viz = [
    "streamlit>=1.38",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypermm"]
