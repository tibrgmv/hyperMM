<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperMM — реплей стакана</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231e8f4e%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">

<header>
  <h1>HyperMM</h1>
  <p id="subtitle" class="muted">загрузка…</p>
</header>

<section id="stats" class="tiles" aria-label="Сводка за час"></section>

<section class="split">
  <figure class="panel">
    <figcaption>
      <h2>Стакан</h2>
      <span class="muted" id="ladder-time"></span>
    </figcaption>
    <div class="legend">
      <span><i class="swatch bid"></i>покупка</span>
      <span><i class="swatch ask"></i>продажа</span>
    </div>
    <div id="ladder" class="ladder"></div>
  </figure>

  <figure class="panel">
    <figcaption>
      <h2>Середина цены</h2>
      <span class="muted">за час, наведите курсор</span>
    </figcaption>
    <canvas id="mid" height="260"></canvas>
    <div id="mid-tip" class="tip" hidden></div>
  </figure>
</section>

<div class="scrub">
  <label for="frame">Момент времени</label>
  <input id="frame" type="range" min="0" value="0" step="1">
  <output id="frame-label" class="mono"></output>
</div>

<figure class="panel">
  <figcaption>
    <h2>Исполняемость по позиции в очереди</h2>
    <span class="muted">заявки разбиты на десять равных групп по объёму, стоявшему впереди</span>
  </figcaption>
  <canvas id="queue" height="240"></canvas>
  <div id="queue-tip" class="tip" hidden></div>
  <details>
    <summary>Показать таблицей</summary>
    <table id="queue-table"></table>
  </details>
</figure>

<footer class="muted">
  <p>Данные: <em>An Open Book</em>, L4-датасет Hyperliquid (Zenodo 18184441).
  Стакан восстановлен из потока изменений книги, время взято из потока
  жизненного цикла заявок, исполнения — из потока сделок.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
